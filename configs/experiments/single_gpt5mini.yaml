experiment:
  type: "single_agent"
  name: "single_gpt5mini"
  input_path: "data/input_code"

llm:
  provider: "azure_foundry"
  model: "gpt-5-mini"              # Azure AI Foundry deployment name
  temperature: 1.0                 # gpt-5-mini only supports its default temperature (1)
  reasoning_effort: "medium"       # minimal | low | medium | high
